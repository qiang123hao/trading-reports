<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1880" viewBox="0 0 1080 1880"><rect width="100%" height="100%" fill="#f4f6f8"/><rect x="0" y="0" width="1080" height="270" rx="0" fill="#17212b" stroke="#17212b"/><text x="64" y="75" font-family="Arial, Noto Sans SC, sans-serif" font-size="54px" font-weight="700" fill="#fff" text-anchor="start">涨幅榜压力位</text><text x="64" y="137" font-family="Arial, Noto Sans SC, sans-serif" font-size="54px" font-weight="700" fill="#fff" text-anchor="start">多空回测信息图</text><text x="66" y="198" font-family="Arial, Noto Sans SC, sans-serif" font-size="25px" font-weight="400" fill="#c9d4de" text-anchor="start">日线 EMA 临近压力位｜北京时间 11/21–11/26</text><rect x="54" y="306" width="972" height="165" rx="18" fill="#fff" stroke="#e1e6eb"/><text x="82" y="352" font-family="Arial, Noto Sans SC, sans-serif" font-size="26px" font-weight="700" fill="#17212b" text-anchor="start">回测口径</text><text x="82" y="394" font-family="Arial, Noto Sans SC, sans-serif" font-size="24px" font-weight="400" fill="#43515d" text-anchor="start">价格低于日线 EMA7 / EMA25 / EMA99，且距离不超过 2%</text><text x="82" y="432" font-family="Arial, Noto Sans SC, sans-serif" font-size="22px" font-weight="400" fill="#657582" text-anchor="start">同币种同类型信号间隔 6 小时去重；收益未计手续费、资金费率和滑点</text><text x="54" y="535" font-family="Arial, Noto Sans SC, sans-serif" font-size="34px" font-weight="700" fill="#17212b" text-anchor="start">一、压力位信号：多空对比</text><text x="54" y="578" font-family="Arial, Noto Sans SC, sans-serif" font-size="22px" font-weight="400" fill="#657582" text-anchor="start">共 17 个信号；平均收益按直接持有计算</text><rect x="54" y="620" width="972" height="116" rx="18" fill="#fff" stroke="#e1e6eb"/><text x="82" y="660" font-family="Arial, Noto Sans SC, sans-serif" font-size="28px" font-weight="700" fill="#17212b" text-anchor="start">1小时</text><text x="245" y="658" font-family="Arial, Noto Sans SC, sans-serif" font-size="25px" font-weight="700" fill="#bd3f32" text-anchor="start">做多  胜率 52.9%</text><text x="245" y="698" font-family="Arial, Noto Sans SC, sans-serif" font-size="23px" font-weight="400" fill="#bd3f32" text-anchor="start">平均 +0.01%</text><text x="655" y="658" font-family="Arial, Noto Sans SC, sans-serif" font-size="25px" font-weight="700" fill="#16805d" text-anchor="start">做空  胜率 47.1%</text><text x="655" y="698" font-family="Arial, Noto Sans SC, sans-serif" font-size="23px" font-weight="400" fill="#16805d" text-anchor="start">平均 -0.01%</text><rect x="54" y="765" width="972" height="116" rx="18" fill="#fff" stroke="#e1e6eb"/><text x="82" y="805" font-family="Arial, Noto Sans SC, sans-serif" font-size="28px" font-weight="700" fill="#17212b" text-anchor="start">4小时</text><text x="245" y="803" font-family="Arial, Noto Sans SC, sans-serif" font-size="25px" font-weight="700" fill="#bd3f32" text-anchor="start">做多  胜率 40.0%</text><text x="245" y="843" font-family="Arial, Noto Sans SC, sans-serif" font-size="23px" font-weight="400" fill="#bd3f32" text-anchor="start">平均 +1.05%</text><text x="655" y="803" font-family="Arial, Noto Sans SC, sans-serif" font-size="25px" font-weight="700" fill="#16805d" text-anchor="start">做空  胜率 60.0%</text><text x="655" y="843" font-family="Arial, Noto Sans SC, sans-serif" font-size="23px" font-weight="400" fill="#16805d" text-anchor="start">平均 -1.05%</text><rect x="54" y="910" width="972" height="116" rx="18" fill="#fff" stroke="#e1e6eb"/><text x="82" y="950" font-family="Arial, Noto Sans SC, sans-serif" font-size="28px" font-weight="700" fill="#17212b" text-anchor="start">12小时</text><text x="245" y="948" font-family="Arial, Noto Sans SC, sans-serif" font-size="25px" font-weight="700" fill="#bd3f32" text-anchor="start">做多  胜率 44.4%</text><text x="245" y="988" font-family="Arial, Noto Sans SC, sans-serif" font-size="23px" font-weight="400" fill="#bd3f32" text-anchor="start">平均 +2.06%</text><text x="655" y="948" font-family="Arial, Noto Sans SC, sans-serif" font-size="25px" font-weight="700" fill="#16805d" text-anchor="start">做空  胜率 55.6%</text><text x="655" y="988" font-family="Arial, Noto Sans SC, sans-serif" font-size="23px" font-weight="400" fill="#16805d" text-anchor="start">平均 -2.06%</text><text x="54" y="1125" font-family="Arial, Noto Sans SC, sans-serif" font-size="34px" font-weight="700" fill="#17212b" text-anchor="start">二、价格上涨 + OI 快速增长</text><text x="54" y="1168" font-family="Arial, Noto Sans SC, sans-serif" font-size="22px" font-weight="400" fill="#657582" text-anchor="start">24小时涨幅为正，且 5分钟 OI 增长 ≥ 5%；共 10 个信号</text><rect x="54" y="1210" width="972" height="116" rx="18" fill="#fff" stroke="#e1e6eb"/><text x="82" y="1250" font-family="Arial, Noto Sans SC, sans-serif" font-size="28px" font-weight="700" fill="#17212b" text-anchor="start">1小时</text><text x="245" y="1248" font-family="Arial, Noto Sans SC, sans-serif" font-size="25px" font-weight="700" fill="#bd3f32" text-anchor="start">做多  胜率 30.0%</text><text x="245" y="1288" font-family="Arial, Noto Sans SC, sans-serif" font-size="23px" font-weight="400" fill="#bd3f32" text-anchor="start">平均 -2.06%</text><text x="655" y="1248" font-family="Arial, Noto Sans SC, sans-serif" font-size="25px" font-weight="700" fill="#16805d" text-anchor="start">做空  胜率 70.0%</text><text x="655" y="1288" font-family="Arial, Noto Sans SC, sans-serif" font-size="23px" font-weight="400" fill="#16805d" text-anchor="start">平均 +2.06%</text><rect x="54" y="1355" width="972" height="116" rx="18" fill="#fff" stroke="#e1e6eb"/><text x="82" y="1395" font-family="Arial, Noto Sans SC, sans-serif" font-size="28px" font-weight="700" fill="#17212b" text-anchor="start">4小时</text><text x="245" y="1393" font-family="Arial, Noto Sans SC, sans-serif" font-size="25px" font-weight="700" fill="#bd3f32" text-anchor="start">做多  胜率 20.0%</text><text x="245" y="1433" font-family="Arial, Noto Sans SC, sans-serif" font-size="23px" font-weight="400" fill="#bd3f32" text-anchor="start">平均 -2.08%</text><text x="655" y="1393" font-family="Arial, Noto Sans SC, sans-serif" font-size="25px" font-weight="700" fill="#16805d" text-anchor="start">做空  胜率 80.0%</text><text x="655" y="1433" font-family="Arial, Noto Sans SC, sans-serif" font-size="23px" font-weight="400" fill="#16805d" text-anchor="start">平均 +2.08%</text><rect x="54" y="1500" width="972" height="116" rx="18" fill="#fff" stroke="#e1e6eb"/><text x="82" y="1540" font-family="Arial, Noto Sans SC, sans-serif" font-size="28px" font-weight="700" fill="#17212b" text-anchor="start">12小时</text><text x="245" y="1538" font-family="Arial, Noto Sans SC, sans-serif" font-size="25px" font-weight="700" fill="#bd3f32" text-anchor="start">做多  胜率 50.0%</text><text x="245" y="1578" font-family="Arial, Noto Sans SC, sans-serif" font-size="23px" font-weight="400" fill="#bd3f32" text-anchor="start">平均 +4.63%</text><text x="655" y="1538" font-family="Arial, Noto Sans SC, sans-serif" font-size="25px" font-weight="700" fill="#16805d" text-anchor="start">做空  胜率 50.0%</text><text x="655" y="1578" font-family="Arial, Noto Sans SC, sans-serif" font-size="23px" font-weight="400" fill="#16805d" text-anchor="start">平均 -4.63%</text><rect x="54" y="1680" width="972" height="145" rx="18" fill="#fff8df" stroke="#e7b94c"/><text x="82" y="1722" font-family="Arial, Noto Sans SC, sans-serif" font-size="26px" font-weight="700" fill="#805b00" text-anchor="start">阶段性观察</text><text x="82" y="1763" font-family="Arial, Noto Sans SC, sans-serif" font-size="24px" font-weight="400" fill="#493b20" text-anchor="start">压力位不是单纯做空信号：短线回落与后续突破并存。</text><text x="82" y="1798" font-family="Arial, Noto Sans SC, sans-serif" font-size="24px" font-weight="400" fill="#493b20" text-anchor="start">OI 快速增加时，追多短线明显偏弱；仍需结合是否真正站稳 EMA。</text><text x="54" y="1855" font-family="Arial, Noto Sans SC, sans-serif" font-size="18px" font-weight="400" fill="#7b8791" text-anchor="start">仅供研究，不构成交易建议｜数据截至 2026-11-26 20:20 北京时间</text></svg>