<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>压力位方向切换策略</title><style>body{margin:0;background:#f4f6f8;display:flex;justify-content:center}svg{max-width:1080px;width:100%;height:auto}</style><svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2100" viewBox="0 0 1080 2100"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a7b3bd"/></marker></defs><rect width="100%" height="100%" fill="#f4f6f8"/><rect x="0" y="0" width="1080" height="255" rx="0" fill="#17212b" stroke="#17212b" stroke-width="2"/><text x="64" y="70" font-family="Arial, Noto Sans SC, sans-serif" font-size="52px" font-weight="700" fill="#fff" text-anchor="start">压力位方向切换策略</text><text x="66" y="128" font-family="Arial, Noto Sans SC, sans-serif" font-size="40px" font-weight="700" fill="#d7e1e9" text-anchor="start">涨幅榜实盘执行流程</text><text x="66" y="188" font-family="Arial, Noto Sans SC, sans-serif" font-size="27px" font-weight="400" fill="#b8c7d2" text-anchor="start">压力位是观察区，不是固定做空区</text><rect x="54" y="292" width="972" height="150" rx="18" fill="#fff8df" stroke="#e3b64d" stroke-width="2"/><text x="82" y="335" font-family="Arial, Noto Sans SC, sans-serif" font-size="27px" font-weight="700" fill="#805b00" text-anchor="start">核心原则</text><text x="82" y="378" font-family="Arial, Noto Sans SC, sans-serif" font-size="25px" font-weight="400" fill="#493b20" text-anchor="start">先看结构，再定方向：15分钟 / 1小时决定多空，EMA、排名、OI 只做背景。</text><text x="82" y="414" font-family="Arial, Noto Sans SC, sans-serif" font-size="25px" font-weight="400" fill="#493b20" text-anchor="start">空头失效 ≠ 多头成立；必须等“站稳 + 回踩确认”。</text><path d="M540 535 L540 610" stroke="#a7b3bd" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M540 730 L540 805" stroke="#a7b3bd" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M540 925 L540 1000" stroke="#a7b3bd" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M540 1120 L540 1195" stroke="#a7b3bd" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="490" y="480" width="100" height="150" rx="18" fill="#fff" stroke="#dfe5ea" stroke-width="2"/><text x="516" y="518" font-family="Arial, Noto Sans SC, sans-serif" font-size="25px" font-weight="700" fill="#17212b" text-anchor="start">① 进入观察区</text><text x="516" y="558" font-family="Arial, Noto Sans SC, sans-serif" font-size="21px" font-weight="400" fill="#4d5d69" text-anchor="start">价格接近日线 EMA7 / 25 / 99</text><text x="516" y="588" font-family="Arial, Noto Sans SC, sans-serif" font-size="21px" font-weight="400" fill="#4d5d69" text-anchor="start">距离 ≤ 2%；先不追多、不急空</text><rect x="54" y="610" width="460" height="150" rx="18" fill="#fff1f0" stroke="#e7aaa5" stroke-width="2"/><text x="80" y="648" font-family="Arial, Noto Sans SC, sans-serif" font-size="25px" font-weight="700" fill="#17212b" text-anchor="start">② 做空确认</text><text x="80" y="688" font-family="Arial, Noto Sans SC, sans-serif" font-size="21px" font-weight="400" fill="#4d5d69" text-anchor="start">冲击压力位 → 上影线 / 假突破</text><text x="80" y="718" font-family="Arial, Noto Sans SC, sans-serif" font-size="21px" font-weight="400" fill="#4d5d69" text-anchor="start">15分钟收盘跌回 EMA 下方</text><text x="80" y="748" font-family="Arial, Noto Sans SC, sans-serif" font-size="21px" font-weight="400" fill="#4d5d69" text-anchor="start">反弹不过前高、低点下移</text><rect x="566" y="610" width="460" height="150" rx="18" fill="#edf9f3" stroke="#a8d8bd" stroke-width="2"/><text x="592" y="648" font-family="Arial, Noto Sans SC, sans-serif" font-size="25px" font-weight="700" fill="#17212b" text-anchor="start">③ 多头确认</text><text x="592" y="688" font-family="Arial, Noto Sans SC, sans-serif" font-size="21px" font-weight="400" fill="#4d5d69" text-anchor="start">价格没有继续下跌</text><text x="592" y="718" font-family="Arial, Noto Sans SC, sans-serif" font-size="21px" font-weight="400" fill="#4d5d69" text-anchor="start">低点抬高 → 收盘站回 EMA</text><text x="592" y="748" font-family="Arial, Noto Sans SC, sans-serif" font-size="21px" font-weight="400" fill="#4d5d69" text-anchor="start">回踩 EMA 不破，再考虑做多</text><rect x="54" y="805" width="460" height="150" rx="18" fill="#f5f7f9" stroke="#cbd4dc" stroke-width="2"/><text x="80" y="843" font-family="Arial, Noto Sans SC, sans-serif" font-size="25px" font-weight="700" fill="#17212b" text-anchor="start">空头失效：先退出</text><text x="80" y="883" font-family="Arial, Noto Sans SC, sans-serif" font-size="21px" font-weight="400" fill="#4d5d69" text-anchor="start">做空后 2–3 根 15分钟K线不创新低</text><text x="80" y="913" font-family="Arial, Noto Sans SC, sans-serif" font-size="21px" font-weight="400" fill="#4d5d69" text-anchor="start">重新收盘站上 EMA</text><text x="80" y="943" font-family="Arial, Noto Sans SC, sans-serif" font-size="21px" font-weight="400" fill="#4d5d69" text-anchor="start">OI 下降但价格不跌</text><rect x="566" y="805" width="460" height="150" rx="18" fill="#f5f7f9" stroke="#cbd4dc" stroke-width="2"/><text x="592" y="843" font-family="Arial, Noto Sans SC, sans-serif" font-size="25px" font-weight="700" fill="#17212b" text-anchor="start">假突破：取消做多</text><text x="592" y="883" font-family="Arial, Noto Sans SC, sans-serif" font-size="21px" font-weight="400" fill="#4d5d69" text-anchor="start">站上 EMA 后又收盘跌回</text><text x="592" y="913" font-family="Arial, Noto Sans SC, sans-serif" font-size="21px" font-weight="400" fill="#4d5d69" text-anchor="start">回踩跌破确认低点</text><text x="592" y="943" font-family="Arial, Noto Sans SC, sans-serif" font-size="21px" font-weight="400" fill="#4d5d69" text-anchor="start">不追多，重新回到观察</text><rect x="54" y="1000" width="460" height="150" rx="18" fill="#fff1f0" stroke="#e7aaa5" stroke-width="2"/><text x="80" y="1038" font-family="Arial, Noto Sans SC, sans-serif" font-size="25px" font-weight="700" fill="#17212b" text-anchor="start">做空执行</text><text x="80" y="1078" font-family="Arial, Noto Sans SC, sans-serif" font-size="21px" font-weight="400" fill="#4d5d69" text-anchor="start">止损：假突破高点上方</text><text x="80" y="1108" font-family="Arial, Noto Sans SC, sans-serif" font-size="21px" font-weight="400" fill="#4d5d69" text-anchor="start">或 EMA 上方约 1%–2%</text><text x="80" y="1138" font-family="Arial, Noto Sans SC, sans-serif" font-size="21px" font-weight="400" fill="#4d5d69" text-anchor="start">以结构止损为主，不放任亏损</text><rect x="566" y="1000" width="460" height="150" rx="18" fill="#edf9f3" stroke="#a8d8bd" stroke-width="2"/><text x="592" y="1038" font-family="Arial, Noto Sans SC, sans-serif" font-size="25px" font-weight="700" fill="#17212b" text-anchor="start">做多执行</text><text x="592" y="1078" font-family="Arial, Noto Sans SC, sans-serif" font-size="21px" font-weight="400" fill="#4d5d69" text-anchor="start">站稳 EMA + 回踩不破</text><text x="592" y="1108" font-family="Arial, Noto Sans SC, sans-serif" font-size="21px" font-weight="400" fill="#4d5d69" text-anchor="start">排名仍靠前、价格和 OI 同步</text><text x="592" y="1138" font-family="Arial, Noto Sans SC, sans-serif" font-size="21px" font-weight="400" fill="#4d5d69" text-anchor="start">突破后不追第一根，等确认</text><rect x="54" y="1195" width="972" height="150" rx="18" fill="#fff" stroke="#dfe5ea" stroke-width="2"/><text x="80" y="1233" font-family="Arial, Noto Sans SC, sans-serif" font-size="25px" font-weight="700" fill="#17212b" text-anchor="start">④ 持仓管理</text><text x="80" y="1273" font-family="Arial, Noto Sans SC, sans-serif" font-size="21px" font-weight="400" fill="#4d5d69" text-anchor="start">同一币当天最多反手一次；连续两次假突破，当天放弃</text><text x="80" y="1303" font-family="Arial, Noto Sans SC, sans-serif" font-size="21px" font-weight="400" fill="#4d5d69" text-anchor="start">2–4小时没有走出预期方向，主动退出或大幅减仓</text><rect x="54" y="1400" width="972" height="285" rx="18" fill="#fff" stroke="#dfe5ea" stroke-width="2"/><text x="82" y="1444" font-family="Arial, Noto Sans SC, sans-serif" font-size="30px" font-weight="700" fill="#17212b" text-anchor="start">仓位与风险</text><text x="82" y="1490" font-family="Arial, Noto Sans SC, sans-serif" font-size="23px" font-weight="400" fill="#40515d" text-anchor="start">• 单笔最大可接受亏损：账户 0.5%–1%（3000 USDT 账户约 15–30 USDT）</text><text x="82" y="1530" font-family="Arial, Noto Sans SC, sans-serif" font-size="23px" font-weight="400" fill="#40515d" text-anchor="start">• 初次试仓 30%–50%；站稳并回踩确认后，再加剩余仓位</text><text x="82" y="1570" font-family="Arial, Noto Sans SC, sans-serif" font-size="23px" font-weight="400" fill="#40515d" text-anchor="start">• 正常止损依据 EMA、假突破高点或回踩低点；30% 只作灾难止损</text><text x="82" y="1610" font-family="Arial, Noto Sans SC, sans-serif" font-size="23px" font-weight="400" fill="#40515d" text-anchor="start">• 避免压力位附近连续多空切换，不因一次反弹就立即反手</text><rect x="54" y="1730" width="972" height="190" rx="18" fill="#17212b" stroke="#17212b" stroke-width="2"/><text x="82" y="1780" font-family="Arial, Noto Sans SC, sans-serif" font-size="28px" font-weight="700" fill="#9fd7bd" text-anchor="start">实盘口诀</text><text x="82" y="1825" font-family="Arial, Noto Sans SC, sans-serif" font-size="30px" font-weight="700" fill="#fff" text-anchor="start">压力位先看，不要先猜。</text><text x="82" y="1868" font-family="Arial, Noto Sans SC, sans-serif" font-size="30px" font-weight="700" fill="#fff" text-anchor="start">冲高回落做空，空不下去先撤。</text><text x="82" y="1911" font-family="Arial, Noto Sans SC, sans-serif" font-size="30px" font-weight="700" fill="#fff" text-anchor="start">站稳 EMA 不追，回踩不破再多。</text><text x="54" y="1990" font-family="Arial, Noto Sans SC, sans-serif" font-size="18px" font-weight="400" fill="#7b8791" text-anchor="start">仅供研究，不构成交易建议｜策略需继续用实盘与回测样本验证</text><text x="54" y="2025" font-family="Arial, Noto Sans SC, sans-serif" font-size="18px" font-weight="400" fill="#7b8791" text-anchor="start">来源：涨幅榜压力位多空回测与近期实盘观察</text></svg>
